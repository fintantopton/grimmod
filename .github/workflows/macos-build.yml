name: macOS Build

on:
  push:
    branches:
      - macOS
  pull_request:
    branches:
      - macOS
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-
      
      - name: Build (${{ matrix.target }})
        run: |
          cargo build --release --lib --target ${{ matrix.target }}
      
      - name: Verify library (${{ matrix.target }})
        run: |
          file target/${{ matrix.target }}/release/libgrimmod.dylib
          otool -L target/${{ matrix.target }}/release/libgrimmod.dylib || true
      
      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libgrimmod.dylib
          retention-days: 30

  create-universal-binary:
    needs: build
    runs-on: macos-latest
    if: success()
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib \
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib \
            -output universal/libgrimmod.dylib
          file universal/libgrimmod.dylib
      
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-universal
          path: universal/libgrimmod.dylib
          retention-days: 30
  
  release:
    needs: create-universal-binary
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-universal/libgrimmod.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
