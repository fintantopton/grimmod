name: macOS Build

on:
  push:
    branches: [ macOS ]
  pull_request:
    branches: [ macOS ]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64

          - target: x86_64-apple-darwin
            runner: macos-15
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta (for x86_64 on ARM runner)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          override: true

      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            arch -x86_64 brew install libvpx pkg-config
          else
            brew install libvpx pkg-config
          fi

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build (${{ matrix.target }})
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            arch -x86_64 cargo build --release --lib --target ${{ matrix.target }}
          else
            cargo build --release --lib --target ${{ matrix.target }}
          fi

      - name: Verify library
        run: |
          file target/${{ matrix.target }}/release/libgrimmod.dylib
          otool -L target/${{ matrix.target }}/release/libgrimmod.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libgrimmod.dylib
          retention-days: 30

  create-universal-binary:
    needs: build
    runs-on: macos-15
    if: success()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib \
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib \
            -output universal/libgrimmod.dylib

          echo "✅ Universal binary created:"
          file universal/libgrimmod.dylib
          lipo -info universal/libgrimmod.dylib

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-universal
          path: universal/libgrimmod.dylib
          retention-days: 30

  release:
    needs: create-universal-binary
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-universal/libgrimmod.dylib
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
