name: macOS Build

on:
  push:
    branches:
      - macOS
    tags:
      - 'v*'
  pull_request:
    branches:
      - macOS
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    # FIX: Use the matrix OS dynamically so x86_64 runs on an Intel machine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest             # Runs on ARM64 Apple Silicon Mac
            pkg_config_path: "/opt/homebrew/lib/pkgconfig"
          - target: x86_64-apple-darwin
            os: macos-13                 # Runs natively on Intel Mac to avoid Rosetta errors
            pkg_config_path: "/usr/local/lib/pkgconfig"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ matrix.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-build-target-${{ matrix.target }}-

      # FIX: Run native Homebrew installs corresponding to each runner architecture
      - name: Install system dependencies
        run: |
          brew install libvpx pkg-config
      
      - name: Build (${{ matrix.target }})
        env:
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: |
          cargo build --release --lib --target ${{ matrix.target }}
      
      - name: Verify library (${{ matrix.target }})
        run: |
          file target/${{ matrix.target }}/release/libgrimmod.dylib
          otool -L target/${{ matrix.target }}/release/libgrimmod.dylib || true
      
      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libgrimmod.dylib
          retention-days: 30

  create-universal-binary:
    needs: build
    runs-on: macos-latest
    if: success()
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib \
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib \
            -output universal/libgrimmod.dylib
          
          # Verify that the created file contains both arm64 and x86_64 architectures
          file universal/libgrimmod.dylib
      
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: libgrimmod-universal
          path: universal/libgrimmod.dylib
          retention-days: 30
  
  release:
    needs: create-universal-binary
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/libgrimmod-aarch64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-x86_64-apple-darwin/libgrimmod.dylib
            artifacts/libgrimmod-universal/libgrimmod.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
